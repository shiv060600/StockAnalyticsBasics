name: Keep Streamlit Alive

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 10 minutes UTC
  workflow_dispatch:        # Manual trigger option

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        run: curl -sSf https://stockmuze.streamlit.app/ || echo "App is down"